<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0168B5">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Samet Territory Map — Go Wholesale Rayong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--red:#C0272D;--blue:#0168B5;--navy:#1B2A4A;--gold:#C9A84C;--bg:#F4F6F9;--card:#fff;--text:#1B2A4A;--muted:#6B7280;--line:#E5E7EB;
 --sA:#C0272D;--sB:#0168B5;--sC:#9CA3AF;
 --stNone:#9CA3AF;--stMet:#F59E0B;--stContact:#F59E0B;--stQuote:#8B5CF6;--stTrial:#10B981;--stActive:#059669;--stFollow:#0168B5;--stNo:#374151;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:Sarabun,system-ui,-apple-system,sans-serif;color:var(--text);background:var(--bg);font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:15px}
#app{display:flex;flex-direction:column;height:100dvh}
header{background:var(--navy);color:#fff;padding:8px 12px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
header .brand{font-weight:700;font-size:15px;line-height:1.1}
header .brand small{display:block;font-weight:400;font-size:11px;opacity:.75}
header .sf{margin-left:auto;background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:6px 8px}
header .sf option{color:#000}
header .gear{background:none;border:0;color:#fff;font-size:20px;padding:4px}
.sync{font-size:11px;padding:2px 8px;border-radius:10px;background:#374151;white-space:nowrap}
.sync.ok{background:#059669}.sync.demo{background:var(--gold);color:#1B2A4A}.sync.err{background:var(--red)}.sync.busy{background:#F59E0B;color:#1B2A4A}
main{flex:1 1 auto;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow:auto}.view.active{display:block}
#map{position:absolute;inset:0}
nav{flex:0 0 auto;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 0 6px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px}nav button.active{color:var(--blue);font-weight:600}
/* filter bar */
.filters{position:absolute;top:8px;left:8px;right:8px;z-index:500;display:flex;gap:6px;flex-wrap:wrap}
.filters input,.filters select{border:1px solid var(--line);border-radius:20px;padding:7px 12px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);font-size:13px;max-width:46%}
.filters input{flex:1 1 100%;max-width:100%}
.fab{position:absolute;z-index:500;border:0;border-radius:50%;width:46px;height:46px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:22px;display:flex;align-items:center;justify-content:center}
#btnLocate{right:12px;bottom:88px}#btnDrag{right:12px;bottom:152px}#btnDrag.on{background:var(--gold);box-shadow:0 0 0 3px #fff,0 2px 8px rgba(0,0,0,.25)}#btnAdd{right:12px;bottom:24px;background:var(--red);color:#fff}
.legend{position:absolute;left:8px;bottom:14px;z-index:500;background:rgba(255,255,255,.93);border-radius:8px;padding:6px 8px;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.15);display:grid;grid-template-columns:auto auto;gap:2px 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
/* marker */
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 2px 5px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font-weight:700;font-size:12px;font-family:Sarabun}
.pin.gps{border-color:#FFD54F}
.leaflet-popup-content{margin:10px 12px;font-family:Sarabun;font-size:13px;min-width:180px}
.leaflet-popup-content b{font-size:14px}
.popbtn{margin-top:6px;background:var(--blue);color:#fff;border:0;border-radius:6px;padding:6px 10px;width:100%;font-weight:600}
/* list */
.listwrap{padding:10px}
.card{background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);display:flex;gap:10px;align-items:center}
.card .pri{width:34px;height:34px;border-radius:8px;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.card .t{flex:1;min-width:0}.card .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .t small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;color:#fff;margin-right:3px}
.card .dist{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.listbar{display:flex;gap:6px;padding:8px 10px 0;flex-wrap:wrap}
.listbar select,.listbar input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;font-size:13px;flex:1}
.listbar button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
.count{padding:4px 12px;font-size:12px;color:var(--muted)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.sheet.open{display:flex}
.sheet .panel{background:#fff;width:100%;max-height:94dvh;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
.sheet .ph{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sheet .ph h3{margin:0;font-size:16px;flex:1;line-height:1.2}
.sheet .ph .x{border:0;background:#F3F4F6;border-radius:50%;width:32px;height:32px;font-size:18px}
.sheet .pb{overflow:auto;padding:12px 14px 20px;flex:1}
.sheet .pf{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;background:#fff}
.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:600;font-size:15px}
.btn.primary{background:var(--red);color:#fff;flex:1}.btn.blue{background:var(--blue);color:#fff}.btn.ghost{background:#F3F4F6;color:var(--text)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5}
.info{background:#F8FAFC;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.info div{margin:2px 0}.info .k{color:var(--muted);display:inline-block;min-width:110px}
.quick{display:flex;gap:6px;margin-bottom:12px}
.quick a,.quick button{flex:1;text-align:center;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 4px;color:var(--text);font-size:13px;font-weight:600}
.sec{font-weight:700;font-size:13px;color:var(--blue);margin:14px 0 6px;text-transform:uppercase;letter-spacing:.3px;border-bottom:2px solid #E0EDF7;padding-bottom:3px}
.fg{margin-bottom:9px}.fg label{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid #D1D5DB;border-radius:8px;padding:9px 10px;background:#fff}
.fg textarea{min-height:60px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gpsbox{display:flex;align-items:center;gap:8px;background:#FFF8E1;border:1px solid #FFE082;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:10px}
.gpsbox.gps{background:#E8F5E9;border-color:#A5D6A7}.gpsbox .s{flex:1}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.photos .p{width:72px;height:72px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.photos label{width:72px;height:72px;border:2px dashed #CBD5E1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);cursor:pointer}
.photos label input{display:none}
.hist{border-left:3px solid #E0EDF7;padding-left:10px;margin:6px 0 6px 4px;font-size:13px}
.hist .h{margin-bottom:8px}.hist .h b{color:var(--blue)}.hist .h small{color:var(--muted);display:block}
/* dashboard */
.dash{padding:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:#fff;border-radius:10px;padding:10px;box-shadow:0 1px 3px rgba(0,0,0,.08);border-top:3px solid var(--blue)}
.kpi b{font-size:22px;display:block;line-height:1.1}.kpi small{color:var(--muted);font-size:11px}
.kpi.red{border-top-color:var(--red)}.kpi.gold{border-top-color:var(--gold)}.kpi.green{border-top-color:#059669}
.panelc{background:#fff;border-radius:10px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
.panelc h4{margin:0 0 8px;font-size:14px;color:var(--navy)}
.bar{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.bar .l{width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .b{flex:1;height:14px;background:#EEF2F7;border-radius:7px;overflow:hidden}.bar .b i{display:block;height:100%;background:var(--blue)}
.bar .n{width:32px;text-align:right;font-weight:600}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th{text-align:left;color:var(--muted);font-weight:500;padding:4px;border-bottom:1px solid var(--line)}
table.tb td{padding:5px 4px;border-bottom:1px solid #F1F5F9}
.due{color:var(--red);font-weight:600}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1B2A4A;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:2000;opacity:0;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
.toast.show{opacity:1}
.mono{font-family:ui-monospace,monospace;font-size:12px}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">Samet Territory Map<small>Go Wholesale Rayong ST.14</small></div>
  <span id="sync" class="sync" title="แตะเพื่อดูสถานะ">…</span>
  <select id="sfSel" class="sf" title="SF ผู้บันทึก"></select>
  <button class="gear" id="btnSettings" title="ตั้งค่า">⚙</button>
</header>
<main>
  <section id="vMap" class="view active">
    <div id="map"></div>
    <div class="filters">
      <input id="fSearch" placeholder="🔍 ค้นหาชื่อร้าน / เบอร์ / โซน">
      <select id="fZone"><option value="">ทุกโซน</option></select>
      <select id="fType"><option value="">ทุกประเภท</option></select>
      <select id="fPri"><option value="">ทุก Priority</option><option>A</option><option>B</option><option>C</option></select>
      <select id="fStatus"><option value="">ทุกสถานะ</option></select>
      <select id="fMember"><option value="">สมาชิก: ทั้งหมด</option><option value="เป็นสมาชิก">เป็นสมาชิกแล้ว</option><option value="ไม่เป็นสมาชิก">ยังไม่เป็นสมาชิก</option><option value="none">ยังไม่ระบุ</option></select>
    </div>
    <div class="legend" id="legend"></div>
    <button class="fab" id="btnDrag" title="โหมดย้ายหมุด">✋</button>
    <button class="fab" id="btnLocate" title="ตำแหน่งฉัน">📍</button>
    <button class="fab" id="btnAdd" title="เพิ่มร้านใหม่">＋</button>
  </section>
  <section id="vList" class="view">
    <div class="listbar">
      <select id="lSort"><option value="near">ใกล้ฉันก่อน</option><option value="pri">Priority</option><option value="zone">โซน</option><option value="due">ถึงกำหนดติดตาม</option><option value="name">ชื่อ</option></select>
      <button id="btnExport">⬇ CSV</button>
    </div>
    <div class="count" id="lCount"></div>
    <div class="listwrap" id="list"></div>
  </section>
  <section id="vDash" class="view"><div class="dash" id="dash"></div></section>
</main>
<nav>
  <button class="active" data-v="vMap"><span class="ic">🗺</span>แผนที่</button>
  <button data-v="vList"><span class="ic">📋</span>รายการ</button>
  <button data-v="vDash"><span class="ic">📊</span>Dashboard</button>
</nav>
</div>

<!-- Prospect detail / visit form -->
<div class="sheet" id="shDetail"><div class="panel">
  <div class="ph"><h3 id="dTitle">ร้าน</h3><button class="x" id="dClose">✕</button></div>
  <div class="pb" id="dBody"></div>
  <div class="pf"><button class="btn ghost" id="dHistBtn">ประวัติ</button><button class="btn primary" id="dSave">💾 บันทึกการเยี่ยม</button></div>
</div></div>

<!-- Settings -->
<div class="sheet" id="shSettings"><div class="panel">
  <div class="ph"><h3>⚙ ตั้งค่า</h3><button class="x" data-close="shSettings">✕</button></div>
  <div class="pb">
    <div class="fg"><label>Google Apps Script Web App URL</label><input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec"></div>
    <p style="font-size:12px;color:var(--muted)">เว้นว่าง = ใช้ URL หลักของทีมที่ฝังไว้ในแอป (ไม่ต้องตั้งค่าเอง) · พิมพ์ <b>demo</b> = โหมดทดลองในเครื่อง</p>
    <div class="fg"><label>รายชื่อ SF (คั่นด้วย , — ใช้เมื่อยังไม่ต่อ Sheet)</label><input id="sSf"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="btn blue sm" id="sTest">ทดสอบการเชื่อมต่อ</button>
      <button class="btn ghost sm" id="sReload">โหลดข้อมูลใหม่</button>
      <button class="btn ghost sm" id="sRetry">ส่งคิวค้าง (<span id="qN">0</span>)</button>
      <button class="btn ghost sm" id="sReset" style="color:var(--red)">ล้างข้อมูลในเครื่อง</button>
    </div>
    <p id="sMsg" class="mono" style="margin-top:10px"></p>
  </div>
  <div class="pf"><button class="btn primary" id="sSave">บันทึกการตั้งค่า</button></div>
</div></div>

<!-- Add prospect -->
<div class="sheet" id="shAdd"><div class="panel">
  <div class="ph"><h3>＋ เพิ่มร้านใหม่ที่พบหน้างาน</h3><button class="x" data-close="shAdd">✕</button></div>
  <div class="pb">
    <div class="gpsbox" id="aGps"><span>📍</span><span class="s">ยังไม่ได้พิกัด</span><button class="btn blue sm" id="aGpsBtn">ใช้ GPS ตรงนี้</button></div>
    <div class="fg"><label>ชื่อร้าน / ผู้ประกอบการ *</label><input id="aName"></div>
    <div class="row2"><div class="fg"><label>ประเภทธุรกิจ</label><select id="aType"></select></div><div class="fg"><label>โซน</label><select id="aZone"></select></div></div>
    <div class="row2"><div class="fg"><label>เบอร์โทร</label><input id="aPhone" inputmode="tel"></div><div class="fg"><label>Priority</label><select id="aPri"><option>A</option><option selected>B</option><option>C</option></select></div></div>
    <div class="fg"><label>หมายเหตุ</label><textarea id="aNotes"></textarea></div>
  </div>
  <div class="pf"><button class="btn primary" id="aSave">บันทึกร้านใหม่</button></div>
</div></div>

<div class="toast" id="toast"></div>

  'Business Type':['โรงแรม/รีสอร์ต','ร้านอาหาร','คาเฟ่','บาร์','ร้านสะดวกซื้อ','ร้านขายของชำ','ตลาด/ร้านค้า','ร้านอาหาร/บาร์','ร้านอาหาร/Beach Club']
};
const STATUS_COLOR = {'ยังไม่เข้า':'#9CA3AF','พบลูกค้า':'#F59E0B','ได้ Contact':'#F59E0B','เสนอราคา':'#8B5CF6','Trial Order':'#10B981','Active':'#059669','Follow up':'#0168B5','ไม่สนใจ':'#374151','ปิดกิจการ':'#111827'};
const PRI_COLOR = {A:'#C0272D',B:'#0168B5',C:'#9CA3AF'};
const LS = {url:'samet_gas_url', data:'samet_cache', queue:'samet_queue', sf:'samet_sf', sfList:'samet_sf_list', local:'samet_local_edits'};

let state = { prospects:[], visits:[], lists:DEFAULT_LISTS, me:null, current:null, photos:[], gpsFix:null, addFix:null, mode:'demo' };
let map, markers = {}, meMarker, dragMode=false;
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const toast = (m,ms=2200) => { const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),ms); };
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const gasUrl = () => { const u=(localStorage.getItem(LS.url)||'').trim(); return u==='demo'?'':(u||DEFAULT_GAS_URL); };
const setSync = (cls,txt) => { const s=$('#sync'); s.className='sync '+cls; s.textContent=txt; };

// ---------- data layer ----------
async function loadData(force){
  const url = gasUrl();
  if(!url){
    state.mode='demo';
    const local = JSON.parse(localStorage.getItem(LS.local)||'null');
    state.prospects = local?.prospects || SEED.map(p=>({...p}));
    state.visits = local?.visits || [];
    const sfl = (localStorage.getItem(LS.sfList)||'').split(',').map(s=>s.trim()).filter(Boolean);
    state.lists = {...DEFAULT_LISTS, ...(sfl.length?{SF:sfl}:{})};
    setSync('demo','Demo');
    return;
  }
  state.mode='live';
  const cache = JSON.parse(localStorage.getItem(LS.data)||'null');
  if(cache && !force){ state.prospects=cache.prospects; state.visits=cache.visits; state.lists={...DEFAULT_LISTS,...cache.lists}; }
  setSync('busy','กำลังโหลด…');
  try{
    const r = await fetch(url+'?action=all&_='+Date.now());
    const j = await r.json();
    if(!j.ok) throw new Error(j.error);
    state.prospects=j.prospects; state.visits=j.visits; state.lists={...DEFAULT_LISTS,...j.lists};
    localStorage.setItem(LS.data, JSON.stringify({prospects:j.prospects,visits:j.visits,lists:j.lists,time:j.time}));
    setSync('ok','Online');
  }catch(e){
    console.warn(e); state.lastError=String(e.message||e);
    if(!state.prospects.length){ state.prospects = SEED.map(p=>({...p})); }
    setSync('err','Offline (cache)');
    toast('โหลดจาก Sheet ไม่ได้: '+state.lastError,6000);
  }
}
function saveLocal(){ if(state.mode==='demo') localStorage.setItem(LS.local, JSON.stringify({prospects:state.prospects,visits:state.visits})); else localStorage.setItem(LS.data, JSON.stringify({prospects:state.prospects,visits:state.visits,lists:state.lists})); }
function getQueue(){ return JSON.parse(localStorage.getItem(LS.queue)||'[]'); }
function setQueue(q){ localStorage.setItem(LS.queue, JSON.stringify(q)); $('#qN').textContent=q.length; }

async function post(body){
  if(state.mode==='demo') return {ok:true, demo:true};
  const r = await fetch(gasUrl(), {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(body)});
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'server error');
  return j;
}
async function postOrQueue(body){
  try{ return await post(body); }
  catch(e){ const q=getQueue(); q.push({body, t:Date.now()}); setQueue(q); setSync('err','Offline — คิว '+q.length); toast('ไม่มีสัญญาณ — เก็บไว้ในคิว จะส่งเมื่อออนไลน์'); return {ok:true, queued:true}; }
}
async function flushQueue(){
  const q=getQueue(); if(!q.length||state.mode==='demo') return;
  let left=[];
  for(const it of q){ try{ await post(it.body); }catch(e){ left.push(it); } }
  setQueue(left);
  if(!left.length){ toast('ส่งคิวค้างครบแล้ว'); await loadData(true); renderAll(); }
}

// ---------- helpers ----------
function upsertProspect(p){ const i=state.prospects.findIndex(x=>x.id===p.id); if(i>=0) state.prospects[i]={...state.prospects[i],...p}; else state.prospects.push(p); }
function distKm(a,b){ if(!a||!b) return null; const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180; const x=Math.sin(dLat/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }
function fmtDist(d){ return d==null?'':(d<1?Math.round(d*1000)+' ม.':d.toFixed(1)+' กม.'); }
function getPos(opts={}){ return new Promise((res,rej)=>{ if(!navigator.geolocation) return rej(new Error('อุปกรณ์ไม่รองรับ GPS')); navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),e=>rej(e),{enableHighAccuracy:true,timeout:12000,maximumAge:5000,...opts}); }); }
function isDue(p){ return p.nextDate && p.nextDate<=today() && !['Active','ไม่สนใจ','ปิดกิจการ'].includes(p.visitResult); }
function filtered(){
  const q=($('#fSearch').value||'').toLowerCase(), z=$('#fZone').value, t=$('#fType').value, pr=$('#fPri').value, st=$('#fStatus').value, mb=$('#fMember').value;
  return state.prospects.filter(p=> (!z||p.zone===z)&&(!t||p.type===t)&&(!pr||p.priority===pr)&&(!st||(p.visitResult||'ยังไม่เข้า')===st)&&(!mb||(mb==='none'?!p.memberStatus:p.memberStatus===mb))&&(!q||[p.name,p.phone,p.zone,p.contactName,p.id,p.memberId].join(' ').toLowerCase().includes(q)));
}
function fillSelect(sel,items,keep){ const cur=sel.value; sel.innerHTML=(keep!==undefined?`<option value="">${keep}</option>`:'')+items.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join(''); if([...sel.options].some(o=>o.value===cur)) sel.value=cur; }

// ---------- map ----------
function initMap(){
  map = L.map('map',{zoomControl:false}).setView([12.552,101.455],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  L.control.zoom({position:'topright'}).addTo(map);
  Object.entries(ZONES).forEach(([z,[la,ln]])=>{ L.marker([la,ln],{icon:L.divIcon({className:'',html:`<div style="font-size:11px;font-weight:600;color:#1B2A4A;text-shadow:0 0 3px #fff,0 0 3px #fff;white-space:nowrap;transform:translate(-50%,-50%)">${esc(z.split('–')[0].replace(/^หมู่บ้าน\//,''))}</div>`,iconSize:[0,0]}),interactive:false,zIndexOffset:-1000}).addTo(map); });
}
function pinIcon(p){ const c=PRI_COLOR[p.priority]||'#9CA3AF', s=STATUS_COLOR[p.visitResult||'ยังไม่เข้า']||'#9CA3AF';
  return L.divIcon({className:'',iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24],html:`<div class="pin ${p.locSource==='gps'||p.locSource==='map'?'gps':''}" style="background:${s};box-shadow:0 0 0 2px ${c},0 2px 5px rgba(0,0,0,.35)"><span>${esc(p.priority||'')}</span></div>`}); }
function renderMarkers(){
  const show=new Set(filtered().map(p=>p.id));
  state.prospects.forEach(p=>{
    if(!p.lat||!p.lng) return;
    let m=markers[p.id];
    if(!m){ m=L.marker([p.lat,p.lng],{icon:pinIcon(p),draggable:true}); m.on('add',()=>{ if(m.dragging){ dragMode?m.dragging.enable():m.dragging.disable(); } }); m.on('dragend',()=>onPinDragged(p.id,m)); m.bindPopup(()=>popupHtml(p)); m.on('popupopen',()=>{ const b=document.querySelector('.popbtn'); if(b) b.onclick=()=>openDetail(p.id); }); markers[p.id]=m; }
    else { m.setLatLng([p.lat,p.lng]); m.setIcon(pinIcon(p)); }
    if(show.has(p.id)){ if(!map.hasLayer(m)) m.addTo(map); } else if(map.hasLayer(m)) map.removeLayer(m);
  });
}
function popupHtml(p){ const pp=state.prospects.find(x=>x.id===p.id)||p; const d=distKm(state.me,pp);
  return `<b>${esc(pp.name)}</b><br><span class="chip" style="background:${PRI_COLOR[pp.priority]}">${esc(pp.priority)}</span><span class="chip" style="background:${STATUS_COLOR[pp.visitResult||'ยังไม่เข้า']}">${esc(pp.visitResult||'ยังไม่เข้า')}</span><br>${esc(pp.type)} · ${esc(pp.zone)}${d!=null?' · '+fmtDist(d):''}<br>${pp.locSource==='gps'?'📍 พิกัด GPS':pp.locSource==='map'?'📌 ปักบนแผนที่แล้ว':'⚠ ตำแหน่งประมาณตามโซน'}${isDue(pp)?'<br><span class="due">⏰ ถึงกำหนดติดตาม '+esc(pp.nextDate)+'</span>':''}<button class="popbtn">เปิดข้อมูล / บันทึกการเยี่ยม</button>`; }
function renderLegend(){ $('#legend').innerHTML=Object.entries(STATUS_COLOR).slice(0,8).map(([k,c])=>`<span><i style="background:${c}"></i>${esc(k)}</span>`).join('')+`<span style="grid-column:1/-1;color:#6B7280">ขอบสี = Priority (แดง A / น้ำเงิน B / เทา C)</span>`; }
async function locateMe(fly){
  try{ const pos=await getPos(); state.me=pos;
    if(!meMarker){ meMarker=L.circleMarker([pos.lat,pos.lng],{radius:8,color:'#fff',weight:2,fillColor:'#0168B5',fillOpacity:1}).addTo(map); meMarker.bindTooltip('คุณอยู่ที่นี่'); } else meMarker.setLatLng([pos.lat,pos.lng]);
    if(fly) map.flyTo([pos.lat,pos.lng],16); renderList(); return pos; }
  catch(e){ if(fly) toast('หาตำแหน่งไม่ได้: เปิด Location Services แล้วลองใหม่'); }
}

function setDragMode(on){ dragMode=on; $('#btnDrag').classList.toggle('on',on); Object.values(markers).forEach(m=>{ if(m.dragging){ on?m.dragging.enable():m.dragging.disable(); } }); toast(on?'โหมดย้ายหมุด: ลากหมุดไปวางตำแหน่งจริง แล้วยืนยัน':'ปิดโหมดย้ายหมุด'); }
async function onPinDragged(id,m){
  const p=state.prospects.find(x=>x.id===id); const ll=m.getLatLng(); const lat=+ll.lat.toFixed(6), lng=+ll.lng.toFixed(6);
  if(!confirm('ย้ายหมุด "'+p.name+'" มาที่ '+lat+', '+lng+' ?')){ m.setLatLng([p.lat,p.lng]); return; }
  upsertProspect({id, lat, lng, locSource:'map'}); saveLocal(); renderMarkers();
  const res=await postOrQueue({action:'setLocation', id, lat, lng, locSource:'map'});
  toast(res.queued?'บันทึกตำแหน่งในเครื่อง (รอส่ง)':'บันทึกตำแหน่งแล้ว ✓');
}
// ---------- list ----------
function renderList(){
  let rows=filtered(); const sort=$('#lSort').value;
  const pr={A:0,B:1,C:2};
  if(sort==='near'&&state.me) rows.sort((a,b)=>(distKm(state.me,a)??99)-(distKm(state.me,b)??99));
  else if(sort==='pri') rows.sort((a,b)=>(pr[a.priority]??9)-(pr[b.priority]??9)||a.name.localeCompare(b.name,'th'));
  else if(sort==='zone') rows.sort((a,b)=>a.zone.localeCompare(b.zone,'th')||(pr[a.priority]??9)-(pr[b.priority]??9));
  else if(sort==='due') rows.sort((a,b)=>(a.nextDate||'9')<(b.nextDate||'9')?-1:1);
  else rows.sort((a,b)=>a.name.localeCompare(b.name,'th'));
  $('#lCount').textContent=`${rows.length} ร้าน${sort==='near'&&!state.me?' — กด 📍 บนแผนที่เพื่อเรียงตามระยะทาง':''}`;
  $('#list').innerHTML=rows.length?rows.map(p=>`<div class="card" data-id="${esc(p.id)}"><div class="pri" style="background:${PRI_COLOR[p.priority]||'#999'}">${esc(p.priority)}</div><div class="t"><b>${esc(p.name)}</b><small>${esc(p.type)} · ${esc(p.zone)}</small><small><span class="chip" style="background:${STATUS_COLOR[p.visitResult||'ยังไม่เข้า']}">${esc(p.visitResult||'ยังไม่เข้า')}</span>${p.memberStatus==='เป็นสมาชิก'?'<span class="chip" style="background:#059669">สมาชิก</span>':''}${p.sf?esc(p.sf)+' · ':''}${p.contactName?'👤 '+esc(p.contactName):''}${isDue(p)?' <span class="due">⏰ '+esc(p.nextDate)+'</span>':''}</small></div><div class="dist">${fmtDist(distKm(state.me,p))}<br>${p.locSource==='gps'?'📍':p.locSource==='map'?'📌':'~'}</div></div>`).join(''):'<div class="empty">ไม่พบร้านตามเงื่อนไข</div>';
  $('#list').querySelectorAll('.card').forEach(c=>c.onclick=()=>openDetail(c.dataset.id));
}

    <div class="photos" id="vPhotos"><label>📷<span>ถ่ายรูป</span><input type="file" accept="image/*" capture="environment" id="vCam"></label><label>🖼<span>เลือกรูป</span><input type="file" accept="image/*" multiple id="vPick"></label></div>

    <div class="sec">ประวัติการเยี่ยม (${hist.length})</div>
    <div class="hist" id="dHist">${hist.length?hist.map(v=>`<div class="h"><b>${esc(v.visitResult)}</b> → ${esc(v.nextAction||'-')} ${v.nextDate?'('+esc(v.nextDate)+')':''}<small>${esc(v.timestamp)} · ${esc(v.sf)}${v.notes?' · '+esc(v.notes):''}</small>${v.photoUrls?String(v.photoUrls).split('\n').filter(Boolean).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener"><img class="p" src="${esc(u)}" style="width:56px;height:56px;border-radius:6px;object-fit:cover;margin:4px 4px 0 0"></a>`).join(''):''}</div>`).join(''):'<small style="color:var(--muted)">ยังไม่มีประวัติ</small>'}</div>`;
  $('#dCenter').onclick=()=>{ closeSheet('shDetail'); switchView('vMap'); map.flyTo([p.lat,p.lng],17); markers[p.id]?.openPopup(); };
  $('#dPin').onclick=pinHere; $('#vMember').onchange=e=>{ if(e.target.value==='ไม่เป็นสมาชิก') $('#vMemberId').value=''; $('#vMemberId').disabled=(e.target.value==='ไม่เป็นสมาชิก'); }; $('#vMemberId').disabled=(p.memberStatus==='ไม่เป็นสมาชิก');
  $('#vCam').onchange=e=>addPhotos(e.target.files,'shop'); $('#vPick').onchange=e=>addPhotos(e.target.files,'card');
  $('#shDetail').classList.add('open'); $('#dBody').scrollTop=0;
}
async function pinHere(){
  const b=$('#dPin'); b.disabled=true; b.textContent='กำลังหา GPS…';
  try{ const pos=await getPos(); state.gpsFix=pos; state.me=pos;
    const box=$('#dGps'); box.classList.add('gps'); box.querySelector('.s').innerHTML=`ได้พิกัด GPS (±${pos.acc} ม.) — จะบันทึกพร้อมการเยี่ยม<br><span class="mono">${pos.lat}, ${pos.lng}</span>`;
    if(pos.acc>60) toast('ความแม่นยำ GPS ต่ำ (±'+pos.acc+' ม.) ลองยืนกลางแจ้งแล้วกดใหม่',3000);
    b.textContent='ปักใหม่'; }
  catch(e){ toast('หาตำแหน่งไม่ได้ — ตรวจสอบ Location permission'); b.textContent='ปักหมุดตรงนี้'; }
  b.disabled=false;
}
function compressImage(file,max=1280,q=.78){ return new Promise(res=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ const r=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*r); c.height=Math.round(img.height*r); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); res(c.toDataURL('image/jpeg',q)); }; img.src=u; }); }
async function addPhotos(files,kind){
  for(const f of [...files]){ if(state.photos.length>=6){ toast('สูงสุด 6 รูปต่อครั้ง'); break; } const d=await compressImage(f); state.photos.push({dataUrl:d,kind}); }
  renderPhotos();
}
function renderPhotos(){ const w=$('#vPhotos'); w.querySelectorAll('.p').forEach(e=>e.remove()); state.photos.forEach((p,i)=>{ const img=document.createElement('img'); img.className='p'; img.src=p.dataUrl; img.title='แตะเพื่อลบ'; img.onclick=()=>{ state.photos.splice(i,1); renderPhotos(); }; w.prepend(img); }); }

async function saveVisit(){
  const p=state.current; const sf=$('#sfSel').value;
  if(!sf){ toast('เลือกชื่อ SF ที่มุมขวาบนก่อนบันทึก'); return; }
  const visit={ prospectId:p.id, prospectName:p.name, sf, visitResult:$('#vResult').value, nextAction:$('#vNext').value, nextDate:$('#vDate').value,
    contactName:$('#vContact').value.trim(), contactLine:$('#vLine').value.trim(), currentSupplier:$('#vSupplier').value.trim(), estSales:$('#vSales').value.trim(),
    deliveryDays:$('#vDays').value.trim(), deliveryMethod:$('#vMethod').value, memberStatus:$('#vMember').value, memberId:$('#vMemberId').value.trim(), skuInterest:$('#vSku').value.trim(), competitorPrice:$('#vComp').value.trim(), notes:$('#vNotes').value.trim(),
    lat: state.gpsFix?state.gpsFix.lat:'', lng: state.gpsFix?state.gpsFix.lng:'' };
  const b=$('#dSave'); b.disabled=true; b.textContent='กำลังบันทึก…';
  const ts=new Date().toISOString().slice(0,19).replace('T',' ');
  // optimistic local update
  const upd={...p}; ['contactName','contactLine','currentSupplier','estSales','deliveryDays','deliveryMethod','memberStatus','memberId','skuInterest','competitorPrice','visitResult','nextAction','nextDate','notes'].forEach(k=>{ if(visit[k]!=='') upd[k]=visit[k]; });
  upd.sf=sf; upd.lastVisit=ts; if(state.gpsFix){ upd.lat=state.gpsFix.lat; upd.lng=state.gpsFix.lng; upd.locSource='gps'; }
  upsertProspect(upd);
  state.visits.push({...visit, visitId:'local'+Date.now(), timestamp:ts, photoUrls: state.mode==='demo'?state.photos.map(x=>x.dataUrl).join('\n'):''});
  saveLocal();
  const res=await postOrQueue({action:'saveVisit', visit, photos:state.photos, updateLocation:!!state.gpsFix});
  if(res.prospect) { upsertProspect(res.prospect); saveLocal(); }
  b.disabled=false; b.textContent='💾 บันทึกการเยี่ยม';
  toast(res.queued?'บันทึกในเครื่องแล้ว (รอส่ง)':'บันทึกเรียบร้อย ✓');
  closeSheet('shDetail'); renderAll();
}

// ---------- add prospect ----------
function openAdd(){ state.addFix=null; $('#aGps').classList.remove('gps'); $('#aGps .s').textContent='ยังไม่ได้พิกัด (จะใช้กึ่งกลางโซนที่เลือก)'; fillSelect($('#aType'),state.lists['Business Type']); fillSelect($('#aZone'),Object.keys(ZONES)); ['aName','aPhone','aNotes'].forEach(i=>$('#'+i).value=''); $('#shAdd').classList.add('open'); }
$('#aGpsBtn').onclick=async()=>{ try{ const pos=await getPos(); state.addFix=pos; $('#aGps').classList.add('gps'); $('#aGps .s').textContent=`ได้พิกัด GPS ±${pos.acc} ม. (${pos.lat}, ${pos.lng})`; }catch(e){ toast('หาตำแหน่งไม่ได้'); } };
$('#aSave').onclick=async()=>{
  const name=$('#aName').value.trim(); if(!name){ toast('กรอกชื่อร้าน'); return; }
  const zone=$('#aZone').value, zc=ZONES[zone]||[12.55,101.455];
  const type=$('#aType').value;
  const p={ id:'', name, type, zone, phone:$('#aPhone').value.trim(), priority:$('#aPri').value, dataStatus:'พบหน้างาน', targetContact:type.includes('โรงแรม')?'Owner / Purchasing / Chef':'Owner / Manager',
    productGroups:type.includes('โรงแรม')?'Fresh, Frozen, Dry, Beverage, Housekeeping':'Beverage, Snack, Dry, FMCG',
    lat: state.addFix?state.addFix.lat:+(zc[0]+(Math.random()-.5)*0.001).toFixed(6), lng: state.addFix?state.addFix.lng:+(zc[1]+(Math.random()-.5)*0.001).toFixed(6), locSource: state.addFix?'gps':'zone',
    contactName:'',contactLine:'',currentSupplier:'',estSales:'',deliveryDays:'',deliveryMethod:'',skuInterest:'',competitorPrice:'',visitResult:'ยังไม่เข้า',nextAction:'',nextDate:'',sf:$('#sfSel').value,lastVisit:'',notes:$('#aNotes').value.trim(),sourceUrl:'',updatedAt:'',memberStatus:'',memberId:'' };
  const prefix=type.includes('โรงแรม')?'H':'N'; let n=1; state.prospects.forEach(x=>{ const m=String(x.id).match(new RegExp('^'+prefix+'-(\\d+)$')); if(m) n=Math.max(n,+m[1]+1); });
  p.id=prefix+'-'+String(n).padStart(3,'0');
  upsertProspect(p); saveLocal();
  const res=await postOrQueue({action:'addProspect', prospect:p});
  if(res.prospect && res.prospect.id!==p.id){ state.prospects=state.prospects.filter(x=>x.id!==p.id); upsertProspect(res.prospect); saveLocal(); }
  closeSheet('shAdd'); renderAll(); toast('เพิ่มร้านแล้ว ✓'); map.flyTo([p.lat,p.lng],17);
};

// ---------- dashboard ----------
function renderDash(){
  const P=state.prospects, n=P.length, st=k=>P.filter(p=>(p.visitResult||'ยังไม่เข้า')===k).length;
  const visited=P.filter(p=>p.visitResult&&p.visitResult!=='ยังไม่เข้า').length;
  const gps=P.filter(p=>p.locSource==='gps'||p.locSource==='map').length, due=P.filter(isDue), active=st('Active'), trial=st('Trial Order');
  const wk=new Date(Date.now()-7*864e5).toISOString().slice(0,10); const v7=state.visits.filter(v=>String(v.timestamp).slice(0,10)>=wk).length;
  const bar=(label,val,max,color)=>`<div class="bar"><span class="l">${esc(label)}</span><span class="b"><i style="width:${max?Math.round(val/max*100):0}%;background:${color||'var(--blue)'}"></i></span><span class="n">${val}</span></div>`;
  const funnel=['ยังไม่เข้า','พบลูกค้า','ได้ Contact','เสนอราคา','Trial Order','Active','Follow up','ไม่สนใจ','ปิดกิจการ'].map(k=>[k,st(k)]);
  const bySF={}; state.visits.forEach(v=>{ if(!v.sf) return; bySF[v.sf]=bySF[v.sf]||{v:0,p:new Set()}; bySF[v.sf].v++; bySF[v.sf].p.add(v.prospectId); });
  const sfRows=Object.entries(bySF).sort((a,b)=>b[1].v-a[1].v);
  const byZone={}; P.forEach(p=>{ byZone[p.zone]=byZone[p.zone]||{n:0,v:0,a:0}; byZone[p.zone].n++; if(p.visitResult&&p.visitResult!=='ยังไม่เข้า') byZone[p.zone].v++; if(['Trial Order','Active'].includes(p.visitResult)) byZone[p.zone].a++; });
  const zRows=Object.entries(byZone).sort((a,b)=>b[1].n-a[1].n);
  const pri=['A','B','C'].map(k=>{ const g=P.filter(p=>p.priority===k); return [k,g.length,g.filter(p=>p.visitResult&&p.visitResult!=='ยังไม่เข้า').length]; });
  $('#dash').innerHTML=`
    <div class="kpis">
      <div class="kpi"><b>${n}</b><small>Prospect ทั้งหมด</small></div>
      <div class="kpi gold"><b>${visited}</b><small>เข้าเยี่ยมแล้ว (${n?Math.round(visited/n*100):0}%)</small></div>
      <div class="kpi green"><b>${trial+active}</b><small>Trial + Active</small></div>
      <div class="kpi red"><b>${due.length}</b><small>ถึงกำหนดติดตาม</small></div>
      <div class="kpi"><b>${v7}</b><small>เยี่ยม 7 วันล่าสุด</small></div>
      <div class="kpi"><b>${gps}</b><small>ปักตำแหน่งจริงแล้ว</small></div>
      <div class="kpi green"><b>${P.filter(p=>p.memberStatus==='เป็นสมาชิก').length}</b><small>เป็นสมาชิกแล้ว</small></div>
      <div class="kpi gold"><b>${P.filter(p=>p.memberStatus==='ไม่เป็นสมาชิก').length}</b><small>ยังไม่เป็นสมาชิก (โอกาสเปิด)</small></div>
    </div>
    <div class="panelc"><h4>Funnel สถานะลูกค้า</h4>${funnel.map(([k,v])=>bar(k,v,n,STATUS_COLOR[k])).join('')}</div>
    <div class="panelc"><h4>ความคืบหน้าตาม Priority</h4>${pri.map(([k,t,v])=>bar(`Priority ${k} (${v}/${t})`,v,t,PRI_COLOR[k])).join('')}</div>
    <div class="panelc"><h4>ผลงานราย SF</h4>${sfRows.length?`<table class="tb"><tr><th>SF</th><th>ครั้งที่เยี่ยม</th><th>ร้านที่เข้า</th></tr>${sfRows.map(([s,o])=>`<tr><td>${esc(s)}</td><td>${o.v}</td><td>${o.p.size}</td></tr>`).join('')}</table>`:'<small style="color:var(--muted)">ยังไม่มีการบันทึกเยี่ยม</small>'}</div>
    <div class="panelc"><h4>ตามโซน (เข้าแล้ว / ทั้งหมด)</h4>${zRows.map(([z,o])=>bar(`${z} (${o.v}/${o.n})`,o.v,o.n)).join('')}</div>
    <div class="panelc"><h4>⏰ ถึงกำหนดติดตาม (${due.length})</h4>${due.length?`<table class="tb"><tr><th>ร้าน</th><th>Action</th><th>วันนัด</th><th>SF</th></tr>${due.sort((a,b)=>a.nextDate<b.nextDate?-1:1).map(p=>`<tr data-id="${esc(p.id)}" style="cursor:pointer"><td><b>${esc(p.name)}</b><br><small>${esc(p.zone)}</small></td><td>${esc(p.nextAction)}</td><td class="due">${esc(p.nextDate)}</td><td>${esc(p.sf)}</td></tr>`).join('')}</table>`:'<small style="color:var(--muted)">ไม่มีรายการค้าง</small>'}</div>`;
  $('#dash').querySelectorAll('tr[data-id]').forEach(r=>r.onclick=()=>openDetail(r.dataset.id));
}

// ---------- export ----------
function exportCSV(){
  const cols=['id','name','type','zone','phone','priority','visitResult','nextAction','nextDate','sf','lastVisit','contactName','contactLine','currentSupplier','estSales','deliveryDays','deliveryMethod','memberStatus','memberId','skuInterest','competitorPrice','notes','lat','lng','locSource'];
  const csv='﻿'+cols.join(',')+'\n'+filtered().map(p=>cols.map(c=>'"'+String(p[c]??'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='samet_prospects_'+today()+'.csv'; a.click();
}

// ---------- ui wiring ----------
function switchView(id){ document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id)); document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===id)); if(id==='vMap') setTimeout(()=>map.invalidateSize(),50); if(id==='vDash') renderDash(); if(id==='vList') renderList(); }
function closeSheet(id){ $('#'+id).classList.remove('open'); }
function renderAll(){ fillSelect($('#fZone'),[...new Set(state.prospects.map(p=>p.zone))].sort((a,b)=>a.localeCompare(b,'th')),'ทุกโซน'); fillSelect($('#fType'),[...new Set(state.prospects.map(p=>p.type))],'ทุกประเภท'); fillSelect($('#fStatus'),state.lists['Visit Result'],'ทุกสถานะ');
  const sfl=state.lists.SF||DEFAULT_LISTS.SF; fillSelect($('#sfSel'),sfl,'— SF —'); const savedSf=localStorage.getItem(LS.sf); if(savedSf&&sfl.includes(savedSf)) $('#sfSel').value=savedSf;
  renderMarkers(); renderList(); if($('#vDash').classList.contains('active')) renderDash(); setQueue(getQueue()); }

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.v));
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeSheet(b.dataset.close));
document.querySelectorAll('.sheet').forEach(s=>s.addEventListener('click',e=>{ if(e.target===s) s.classList.remove('open'); }));
$('#dClose').onclick=()=>closeSheet('shDetail'); $('#dSave').onclick=saveVisit; $('#dHistBtn').onclick=()=>$('#dHist').scrollIntoView({behavior:'smooth'});
['fSearch','fZone','fType','fPri','fStatus','fMember'].forEach(i=>$('#'+i).addEventListener('input',()=>{ renderMarkers(); renderList(); }));
$('#lSort').onchange=renderList; $('#btnExport').onclick=exportCSV;
$('#btnLocate').onclick=()=>locateMe(true); $('#btnDrag').onclick=()=>setDragMode(!dragMode); $('#btnAdd').onclick=openAdd;
$('#sfSel').onchange=e=>localStorage.setItem(LS.sf,e.target.value);
$('#sync').onclick=()=>{ if(state.mode==='demo') toast('โหมด Demo — ข้อมูลเก็บในเครื่องนี้เท่านั้น'); else if(state.lastError) toast('ล่าสุด: '+state.lastError,6000); else toast('เชื่อมต่อ Google Sheets ปกติ'); };
$('#btnSettings').onclick=()=>{ $('#sUrl').value=localStorage.getItem(LS.url)||''; $('#sUrl').placeholder='ค่าเริ่มต้น: '+DEFAULT_GAS_URL; $('#sSf').value=localStorage.getItem(LS.sfList)||DEFAULT_LISTS.SF.join(','); $('#sMsg').textContent=''; $('#shSettings').classList.add('open'); };
$('#sSave').onclick=async()=>{ localStorage.setItem(LS.url,$('#sUrl').value.trim()); localStorage.setItem(LS.sfList,$('#sSf').value.trim()); closeSheet('shSettings'); Object.values(markers).forEach(m=>map.removeLayer(m)); markers={}; await loadData(true); renderAll(); toast('บันทึกการตั้งค่าแล้ว'); };
$('#sTest').onclick=async()=>{ const u=$('#sUrl').value.trim()||DEFAULT_GAS_URL; if(u==='demo'){ $('#sMsg').textContent='โหมด Demo'; return; } $('#sMsg').textContent='กำลังทดสอบ…'; try{ const r=await fetch(u+'?action=all&_='+Date.now()); const j=await r.json(); $('#sMsg').textContent=j.ok?'✓ เชื่อมต่อสำเร็จ — อ่าน Sheet ได้ '+(j.prospects||[]).length+' ร้าน, '+(j.visits||[]).length+' บันทึกเยี่ยม (เวลาเซิร์ฟเวอร์ '+j.time+')':'✗ Backend ตอบ error: '+j.error+' — แก้ใน Apps Script แล้ว Deploy > New version'; }catch(e){ $('#sMsg').textContent='✗ เชื่อมต่อไม่ได้: '+e.message+' (ตรวจว่า Deploy เป็น Anyone และ URL ลงท้าย /exec)'; } };
$('#sReload').onclick=async()=>{ closeSheet('shSettings'); await loadData(true); renderAll(); toast('โหลดข้อมูลใหม่แล้ว'); };
$('#sRetry').onclick=flushQueue;
$('#sReset').onclick=()=>{ if(confirm('ล้างข้อมูลที่เก็บในเครื่องนี้ (cache/คิว/แก้ไขในโหมด Demo)?')){ [LS.data,LS.queue,LS.local].forEach(k=>localStorage.removeItem(k)); location.reload(); } };
window.addEventListener('online',flushQueue);

(async function init(){
  if(typeof L==='undefined'){ // map library failed to load (no internet) — keep list/dashboard usable
    map={hasLayer:()=>false,removeLayer(){},flyTo(){},invalidateSize(){}}; L={marker:()=>({setLatLng(){},setIcon(){},bindPopup(){},on(){},addTo(){},openPopup(){}}),divIcon:()=>({}),circleMarker:()=>({addTo(){return this},bindTooltip(){},setLatLng(){}})};
    $('#map').innerHTML='<div class="empty" style="padding-top:120px">โหลดแผนที่ไม่ได้ — ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรช<br>(รายการ และ Dashboard ยังใช้ได้)</div>';
  } else initMap();
  renderLegend();
  await loadData(false); renderAll();
  locateMe(false);
  flushQueue();
  if(state.mode==='demo') toast('โหมด Demo — ข้อมูลเก็บในเครื่องนี้เท่านั้น',3000);
})();
</script>
